name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Package checks and the tarball used by the smoke job run once.
      - name: Check package exports and types
        if: matrix.node == 22
        run: npm run check:package
      - name: Pack
        if: matrix.node == 22
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Upload tarball
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # Installs the packed tarball in a blank project and imports it the way a
  # consumer would, on every Node version the package claims to support.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: tarball
      - name: Install and import (ESM + CJS)
        run: |
          mkdir consumer && cd consumer
          npm init -y >/dev/null
          npm install ../tarball/*.tgz
          node --input-type=module -e "
            import { formatFCFA } from 'fcfa-kit';
            import { normalizePhone } from 'fcfa-kit/cm';
            if (formatFCFA(1500000) !== '1 500 000 FCFA') throw new Error('format');
            if (normalizePhone('677123456') !== '+237677123456') throw new Error('phone');
          "
          node -e "
            const { parseFCFA } = require('fcfa-kit');
            const { regions } = require('fcfa-kit/cm');
            if (parseFCFA('1,5M') !== 1500000) throw new Error('parse');
            if (regions.length !== 10) throw new Error('regions');
          "
